<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
    }

    th {
      width: 60px;
      height: 40px;
      border: 1px solid #333;
      font-size: 22px;
      background: #eee;
    }
    td {
      width: 60px;
      height: 60px;
      border: 1px solid #333;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
    .marked {
      background: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>

<h1>BINGO</h1>
<table id="card">
  <thead>
    <tr>
      <th>B</th>
      <th>I</th>
      <th>N</th>
      <th>G</th>
      <th>O</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="bingo.js"></script>
</body>
</html>
