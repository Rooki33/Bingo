<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo QR</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 40px;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>Scan to Play Bingo</h1>
<canvas id="qr"></canvas>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  const url = window.location.origin + "/Bingo/index.html";
  QRCode.toCanvas(document.getElementById("qr"), url);
</script>

</body>
</html>
